name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The API reference is generated from the packages' docblocks.
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      # The API reference is generated from the packages' docblocks.
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # The site, plus the packages its API reference is generated from; no native toolchains.
      - run: yarn workspaces focus docs react-native-readium react-native-readium-lcp
      # Fails on broken links, so pull requests catch them before they ship.
      - run: yarn workspace docs build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.repository == '5-stones/react-native-readium'
        with:
          path: docs/build

  deploy:
    # Only the main repository publishes; forks still build, which catches broken links.
    if: github.event_name != 'pull_request' && github.repository == '5-stones/react-native-readium'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
