# Git hooks, installed by `yarn` (or `yarn lefthook install`).
# See https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  commands:
    # EDRLab's liblcp setup is private: block a linked Podfile.lock or the podspec URL.
    liblcp-leaks:
      run: node scripts/check-liblcp-leaks.js --staged
